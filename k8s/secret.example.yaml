apiVersion: v1
kind: Secret
metadata:
  name: news-service-secret
type: Opaque

# Example only. Do not apply this file with real values and do not commit real secrets.
# Jenkinsfile creates/updates this secret from Jenkins Credentials at deploy time.
stringData:
  DB_USERNAME: "[USERNAME]"
  DB_PASSWORD: "[PASSWORD]"
  CLOUDINARY_CLOUD_NAME: "[CLOUDINARY_CLOUD_NAME]"
  CLOUDINARY_API_KEY: "[CLOUDINARY_API_KEY]"
  CLOUDINARY_API_SECRET: "[CLOUDINARY_API_SECRET]"
